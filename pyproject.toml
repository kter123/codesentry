[project]
name = "codesentry"
version = "0.1.0"
description = "LLM multi-agent code security audit platform"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.3.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "openai>=3.35.1",
]

[project.scripts]
codesentry = "codesentry.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
